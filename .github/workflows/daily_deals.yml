name: Daily Multi-Source E-Bike Deals Refresh

on:
  schedule:
    # Runs twice daily at 06:00 AM and 18:00 PM UTC
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Allows manual trigger anytime via GitHub Actions button

jobs:
  update-deals:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Multi-Source Deal Aggregator
        run: |
          node fetch_deals.js

      - name: Commit and Push Updated Deals
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add deals.json deals-data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-refresh live e-bike deals feed [skip ci]" && git push)
