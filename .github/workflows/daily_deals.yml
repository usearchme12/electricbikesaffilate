name: Daily E-Bike Deals Auto-Refresh

on:
  schedule:
    # Runs twice daily at 06:00 UTC and 18:00 UTC.
    # Note: GitHub Actions uses UTC.
    # - UK Summer Time (BST / UTC+1): runs at 07:00 and 19:00 UK time.
    # - UK Winter Time (GMT / UTC+0): runs at 06:00 and 18:00 UK time.
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Allows manual trigger anytime in GitHub Actions UI

jobs:
  update-deals:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Multi-Source Deal Aggregator
        run: |
          node fetch_deals.js

      - name: Commit and Push Updated Deals
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add deals.json deals-data.js price-history.json
          # Only commits if prices or inventory actually changed
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-refresh daily e-bike deals [skip ci]" && git push)

